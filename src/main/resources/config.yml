# Only increase this value when the default configuration structure changes.
config-version: 9

# AUTOMATIC uses colors.yml; MENU lets players pick a color with /elocolors.
color-system:
  mode: 'AUTOMATIC'
  notify-on-threshold-loss: true

# No money or Elo is awarded and no penalties apply in these worlds.
# World names are matched case-insensitively.
combat:
  disabled-worlds: []

# Number of entries shown per page by /elo top (1-50).
leaderboard:
  entries-per-page: 10

# Protection against repeated kills on the same player.
# Affects the killer's reward; the victim's penalty still applies.
anti-farm:
  enabled: true
  cooldown-seconds: 300
  # BLOCK withholds the reward; REDUCE grants the percentage below.
  mode: 'BLOCK'
  reduction-percent: 50

# Reward given to the player who gets the kill.
kill:
  money: 300.0
  elo: 30
  broadcast: true

# Penalty applied to the victim in enabled worlds, whatever the cause of death.
death:
  money: 50.0
  elo: 10

elo:
  starting-value: 1000
  minimum-value: 0

# Format used for amounts inserted into MiniMessage messages.
money-format: '#,##0.##'

database:
  # MYSQL requires an external server; SQLITE stores everything in a single local file
  # in the plugin directory and needs no extra setup.
  storage-type: 'MYSQL'

  # Only used when storage-type is SQLITE. File name only, no paths.
  sqlite:
    file: 'shelo.db'

  # The following keys are only used when storage-type is MYSQL.
  host: '127.0.0.1'
  port: 3306
  name: 'minecraft'
  username: 'root'
  password: 'change-me'
  table: 'shelo_players'
  use-ssl: false
  allow-public-key-retrieval: true

  pool:
    maximum-size: 10
    minimum-idle: 2
    connection-timeout-ms: 10000
    max-lifetime-ms: 1800000
    keepalive-time-ms: 0
