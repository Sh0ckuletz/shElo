# All messages support MiniMessage and any PlaceholderAPI placeholder.
# Placeholders provided by shElo: %shelo_elo% and %shelo_elo_formatted%
# https://docs.advntr.dev/minimessage/format.html
#
# Palette: accent gradient #4498DB -> #82C7FF, white text, dark gray separators,
# gold for money, yellow for Elo, green/red for gains/losses.
# A message written as a section (prefix + message) can turn the global prefix off.

# Used by the updater to add new messages automatically.
config-version: 12

prefix: '<b><gradient:#4498DB:#82C7FF>shElo</gradient></b> <dark_gray>»</dark_gray> <white>'

kill: '<green>+<elo> Elo</green> <dark_gray>·</dark_gray> <gold>+$<money></gold> <dark_gray>·</dark_gray> killed <player> <dark_gray>(</dark_gray>%shelo_elo%<dark_gray>)</dark_gray>'
kill-broadcast:
  prefix: true
  message: '<killer> killed <victim> <dark_gray>(</dark_gray><yellow><killer_elo> Elo</yellow><dark_gray>)</dark_gray>'
anti-farm-blocked: '<red>No reward for <white><player></white>: repeated kill. Try again in <white><remaining_seconds>s</white>.</red>'
anti-farm-reduced: '<yellow>Repeated kill: reward reduced to <white><percentage>%</white>. Cooldown <white><remaining_seconds>s</white>.</yellow>'
death-player: '<red>-<elo> Elo</red> <dark_gray>·</dark_gray> <gold>-$<money></gold> <dark_gray>·</dark_gray> killed by <killer> <dark_gray>(</dark_gray>%shelo_elo%<dark_gray>)</dark_gray>'
death-other: '<red>-<elo> Elo</red> <dark_gray>·</dark_gray> <gold>-$<money></gold> <dark_gray>·</dark_gray> you died <dark_gray>(</dark_gray>%shelo_elo%<dark_gray>)</dark_gray>'
economy-error: '<red>The economy transaction could not be completed. Please contact an administrator.</red>'
database-error: '<red>The database is currently unavailable. Please try again.</red>'

elo-self: 'Your Elo: <yellow><elo></yellow>'
elo-other: '<player>''s Elo: <yellow><elo></yellow>'
player-not-found: '<red>Player <white><player></white> was not found.</red>'
no-permission: '<red>You do not have permission to do that.</red>'
reload-start: '<yellow>Checking the configuration and opening the new database connection...</yellow>'
reload: '<green>Configuration, messages and database connection reloaded.</green>'
reload-in-progress: '<yellow>A shElo reload is already in progress.</yellow>'
reload-config-error: '<red>The new configuration is invalid. The active settings were left unchanged.</red>'
reload-error: '<red>The new database connection could not be opened. The old connection stays active.</red>'
player-only: '<red>This command can only be used by a player.</red>'
color-menu-disabled: '<red>The color menu is disabled. Set color-system.mode to MENU.</red>'
color-locked: '<red>This color requires <white><required_elo> Elo</white>. Your Elo: <white><current_elo></white>.</red>'
color-selected: '<green>Color selected: <white><color></white>.</green>'
color-threshold-lost: '<red>Your Elo dropped below <white><required_elo></white>. The color <white><color></white> was disabled.</red>'

# Block messages: no prefix on every line, thin divider instead.
stats-self:
  prefix: false
  message: '<b><gradient:#4498DB:#82C7FF>Your PvP stats</gradient></b><newline><dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray><newline><white>Peak Elo  <peak_elo_formatted></white><newline><white>Kills <green><kills></green>  <dark_gray>·</dark_gray>  Deaths <red><deaths></red>  <dark_gray>·</dark_gray>  K/D <yellow><kd></yellow></white><newline><white>Streak <aqua><streak></aqua>  <dark_gray>·</dark_gray>  Best <gold><best_streak></gold></white>'
stats-other:
  prefix: false
  message: '<b><gradient:#4498DB:#82C7FF><player>''s PvP stats</gradient></b><newline><dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray><newline><white>Peak Elo  <peak_elo_formatted></white><newline><white>Kills <green><kills></green>  <dark_gray>·</dark_gray>  Deaths <red><deaths></red>  <dark_gray>·</dark_gray>  K/D <yellow><kd></yellow></white><newline><white>Streak <aqua><streak></aqua>  <dark_gray>·</dark_gray>  Best <gold><best_streak></gold></white>'
stats-usage: 'Usage: /stats [player]'
leaderboard-header:
  prefix: false
  message: '<b><gradient:#4498DB:#82C7FF>Elo Leaderboard</gradient></b> <dark_gray>·</dark_gray> <white>page <page>/<pages> <dark_gray>·</dark_gray> <total_players> players</white><newline><dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>'
leaderboard-entry:
  prefix: false
  message: '<rank_formatted> <white><player></white> <dark_gray>-</dark_gray> <elo_formatted> <yellow>Elo</yellow>'
leaderboard-footer:
  prefix: false
  message: '<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray><newline><white>Previous /elo top <previous_page>  <dark_gray>·</dark_gray>  Next /elo top <next_page></white>'
leaderboard-empty: '<yellow>The Elo leaderboard is empty.</yellow>'
leaderboard-invalid-page: '<red>Page <white><page></white> does not exist. Last page: <white><max_page></white>.</red>'
leaderboard-usage: 'Usage: /elo top [page]'
admin-update: '<green>Elo for <white><player></white> was <action>. New Elo: <yellow><new_elo></yellow>.</green>'
admin-target-update: '<yellow>An administrator changed your Elo. New Elo: <white><new_elo></white>.</yellow>'
admin-invalid-number: '<red>The Elo value must be a whole number, zero or higher.</red>'
admin-usage: 'Usage: /elo set|add|remove <player> <value> or /elo reset <player>'
usage: 'Usage: /elo [player|top|reload|set|add|remove|reset]'
