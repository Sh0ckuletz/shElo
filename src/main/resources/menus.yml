# Menu inspired by the CS2 Premier Rating color tiers.
# A color is only available while the current Elo meets its threshold.
config-version: 2

title: '<gradient:#5e98d9:#ffd700><bold>CS PREMIER RATING</bold></gradient>'
size: 27
default-format: '<#b0b0b0><bold>{elo}</bold></#b0b0b0>'

filler:
  enabled: true
  material: 'BLACK_STAINED_GLASS_PANE'
  name: '<dark_gray> </dark_gray>'

status:
  selected: '<green><bold>SELECTED</bold></green>'
  unlocked: '<yellow>Click to select</yellow>'
  locked: '<red>LOCKED</red>'

# Placeholders available in name and lore:
# <required_elo>, <current_elo>, <highest_elo>, <color_id> and <status>
# format accepts MiniMessage and must contain {elo}.
colors:
  gray:
    slot: 10
    required-elo: 0
    material: 'GRAY_DYE'
    name: '<#b0b0b0><bold>GRAY</bold></#b0b0b0> <dark_gray>| 0 - 4,999</dark_gray>'
    lore:
      - '<dark_gray>Premier Rating Tier</dark_gray>'
      - '<gray>Minimum rating:<white><required_elo></white></gray>'
      - '<gray>Current rating:<white><current_elo></white></gray>'
      - ''
      - '<status>'
    format: '<#b0b0b0><bold>{elo}</bold></#b0b0b0>'

  light_blue:
    slot: 11
    required-elo: 5000
    material: 'LIGHT_BLUE_DYE'
    name: '<#5e98d9><bold>LIGHT BLUE</bold></#5e98d9> <dark_gray>| 5,000 - 9,999</dark_gray>'
