name: shElo
version: '${version}'
main: cc.shockuletz.shelo.ShEloPlugin
api-version: '1.21.11'
author: Sh0ckuletz
description: Economy rewards and Elo ratings for PvP combat.
depend: [Vault]
softdepend: [PlaceholderAPI]

commands:
  elo:
    description: Shows or manages Elo and reloads the plugin.
    usage: /elo [player|top|reload|set|add|remove|reset]
    permission: shelo.command
  stats:
    description: Shows PvP statistics.
    usage: /stats [player]
    permission: shelo.stats
  elocolors:
    description: Opens the Elo color menu.
    usage: /elocolors
    permission: shelo.colors

permissions:
  shelo.command:
    description: Allows using the /elo command.
    default: true
  shelo.stats:
    description: Allows using the /stats command.
    default: true
  shelo.stats.others:
    description: Allows viewing other players' statistics.
    default: true
  shelo.top:
    description: Allows viewing the Elo leaderboard.
    default: true
  shelo.reload:
    description: Allows reloading the shElo configuration.
    default: op
  shelo.admin:
    description: Allows all Elo admin commands.
    default: op
    children:
      shelo.admin.set: true
      shelo.admin.add: true
      shelo.admin.remove: true
      shelo.admin.reset: true
  shelo.admin.set:
    description: Allows setting a player's Elo.
    default: op
  shelo.admin.add:
    description: Allows adding Elo to a player.
    default: op
  shelo.admin.remove:
    description: Allows removing Elo from a player.
    default: op
  shelo.admin.reset:
    description: Allows resetting a player's Elo.
    default: op
  shelo.colors:
    description: Allows opening the Elo color menu.
    default: true
